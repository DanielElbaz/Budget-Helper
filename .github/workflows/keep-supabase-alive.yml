name: Keep Supabase active

# Supabase's free plan pauses a project after ~7 days without activity.
# This workflow sends a tiny read query every 3 days so the database stays up.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Secrets SUPABASE_URL et SUPABASE_ANON_KEY manquants (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          status=$(curl -sS -o response.txt -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/categories?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $status"
          cat response.txt; echo
          if [ "$status" -ge 400 ]; then
            echo "::error::Supabase a répondu $status (projet en pause ou secrets invalides ?)"
            exit 1
          fi
